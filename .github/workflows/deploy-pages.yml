# Deploys the app to GitHub Pages. Lives at publish/github/workflows/ in the private repo and is copied
# to .github/workflows/ by publish/export.mjs. One-time setup: Settings > Pages > Source: GitHub Actions.
# Repository variables: VITE_ARCGIS_CLIENT_ID (public client ID), VITE_CF_BEACON_TOKEN (optional), VITE_SENDING (off|list|opt-in; unset means off), VITE_DELETING (on; unset means off).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit (the tag in the comment), so a moved or hijacked tag can't change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Stop the deploy if a package the site ships has a known high or critical vulnerability.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_ARCGIS_CLIENT_ID: ${{ vars.VITE_ARCGIS_CLIENT_ID }}
          # Empty (unset) means off: the public site stays review-only until this variable is set (ADR 0013).
          VITE_SENDING: ${{ vars.VITE_SENDING }}
          VITE_DELETING: ${{ vars.VITE_DELETING }}
          VITE_CF_BEACON_TOKEN: ${{ vars.VITE_CF_BEACON_TOKEN }}
          # About links to this repository (and its Issues page).
          VITE_REPO_URL: https://github.com/${{ github.repository }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
